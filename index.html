<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <title>Cubeman — Cube World Simulator</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true"></span>
        <span class="brand-name">CUBEMAN</span>
        <span class="brand-sub">Retro Society in Your Browser</span>
      </div>
    </header>

    <main class="app">
      <aside class="rail rail-left" aria-label="Achievements">
        <section class="panel">
          <h2 class="panel-title">Achievements
            <span class="switch-hint" id="goals-switch-hint" title="Toggle to show completed achievements too">focus mode: on</span>
            <label class="switch" title="Show completed achievements">
              <input type="checkbox" id="goals-show-all" aria-label="Show completed achievements" />
              <span></span>
            </label>
          </h2>
          <ul class="goals" id="goals"></ul>
        </section>
      </aside>

      <section class="shelf-wrap" aria-label="Cube shelf">
        <div class="shelf-toolbar">
          <p id="shelf-status" role="status" aria-live="polite"></p>
          <button id="cancel-placement" class="placement-control" type="button" hidden>Cancel placement</button>
        </div>
        <div class="shelf" id="shelf">
          <div class="slot" data-slot="0"></div>
          <div class="slot" data-slot="1"></div>
          <div class="slot slot-empty" data-slot="2"></div>
          <div class="slot slot-empty" data-slot="3"></div>
          <div class="slot slot-empty" data-slot="4"></div>
          <div class="slot slot-empty" data-slot="5"></div>
          <div class="slot slot-empty" data-slot="6"></div>
          <div class="slot slot-empty" data-slot="7"></div>
          <div class="slot slot-empty" data-slot="8"></div>
        </div>
      </section>

      <aside class="rail rail-right" aria-label="Cubemen">
        <section class="panel">
          <h2 class="panel-title">Cubemen</h2>
          <ul class="roster" id="roster"></ul>
        </section>
      </aside>
    </main>

    <footer class="hintstrip" id="hint">Select a cube · 1/2: actions · 0: surprise · Move/Place in the roster, then choose a slot · Escape: cancel</footer>

    <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
